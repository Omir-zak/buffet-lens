# Whole stack:  docker compose up --build
#
#   postgres  app database: conversations, LangGraph checkpoints, vectors (pgvector)
#   api       FastAPI app (port 8000)
#   mcp       MCP server, separate process (port 8001)
#   langfuse  self-hosted observability (port 3000), LOCAL dev keys only
#
# Embeddings come from Ollama on the host (containers reach it via host.docker.internal).
# Secrets (Groq key etc.) are read from .env, which is not in the repo (see .env.example).

x-app-environment: &app-environment
  # Inside the compose network Postgres is reachable on its default port 5432 by service name.
  DATABASE_URL: postgresql://buffett:buffett@postgres:5432/buffett
  EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
  LANGFUSE_HOST: http://langfuse:3000
  HOST: 0.0.0.0

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment: *app-environment
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data:/srv/data  # downloaded letters and text cache (kept out of the image and git)
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: buffett
      POSTGRES_PASSWORD: buffett
      POSTGRES_DB: buffett
    ports:
      # Host port 5433 because 5432 is often taken by a local Postgres install.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buffett"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5
      start_period: 20s

  mcp:
    <<: *app
    command: ["python", "-m", "mcp_server.server"]
    ports:
      - "8001:8001"

  langfuse:
    # Langfuse v2 needs only Postgres (v3 would require ClickHouse, Redis and S3); the project SDK is v2 too.
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://buffett:buffett@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-only-change-me
      SALT: local-dev-only-change-me
      TELEMETRY_ENABLED: "false"
      # Auto-creates the org, project and keys on first start (local development only).
      LANGFUSE_INIT_ORG_ID: buffett-lens
      LANGFUSE_INIT_ORG_NAME: Buffett-Lens
      LANGFUSE_INIT_PROJECT_ID: buffett-lens
      LANGFUSE_INIT_PROJECT_NAME: buffett-lens
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local-dev
      LANGFUSE_INIT_USER_EMAIL: dev@buffett-lens.local
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: local-dev-password

volumes:
  pgdata:
